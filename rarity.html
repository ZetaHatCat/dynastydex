<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DynastyDex Rarity List Official</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121215;
      color: #ffffff;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    header {
      position: relative;
      text-align: center;
      padding: 35px 20px 20px 20px;
    }

    .back-btn {
      position: absolute;
      top: 30px;
      left: 35px;
      background-color: #1e1e24;
      color: #ffffff;
      border: 2px solid #2d2d38;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.25s ease, border-color 0.3s ease, box-shadow 0.3s ease, color 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .back-btn:hover {
      border-color: #a855f7;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
      color: #a855f7;
      transform: translateY(-2px);
    }

    .main-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 
        0 0 10px #a855f7,
        0 0 20px #8b5cf6,
        0 0 35px #7c3aed,
        0 0 50px #6d28d9;
      text-transform: uppercase;
    }

    @media (max-width: 768px) {
      header {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }
      .back-btn {
        position: static;
      }
    }

    .inventory-container {
      width: 100%;
      padding: 20px 35px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 25px;
    }

    .card {
      background-color: #1e1e24;
      border: 2px solid #2d2d38;
      border-radius: 14px;
      padding: 15px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.25s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      user-select: none;
    }

    .card:hover, .card:active {
      transform: scale(1.06);
      z-index: 10;
    }

    .card-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background-color: #ffffff;
      color: #000000;
      font-size: 13px;
      font-weight: bold;
      padding: 3px 9px;
      border-radius: 7px;
      z-index: 2;
    }

    .card-img {
      width: 100%;
      height: 155px;
      object-fit: contain;
      margin-top: 15px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .card-info {
      font-size: 13.5px;
      color: #a0a0ab;
      margin: 3px 0;
    }

    .rarity-val {
      color: #facc15;
      font-weight: bold;
    }

    .artist-val {
      color: #38bdf8;
    }

    .rarity-rainbow:hover {
      animation: neonRainbow 2.5s linear infinite;
    }

    @keyframes neonRainbow {
      0%   { border-color: #ff0055; box-shadow: 0 0 20px #ff0055, 0 0 35px rgba(255, 0, 85, 0.4); }
      20%  { border-color: #ff9900; box-shadow: 0 0 20px #ff9900, 0 0 35px rgba(255, 153, 0, 0.4); }
      40%  { border-color: #33cc33; box-shadow: 0 0 20px #33cc33, 0 0 35px rgba(51, 204, 51, 0.4); }
      60%  { border-color: #00ccff; box-shadow: 0 0 20px #00ccff, 0 0 35px rgba(0, 204, 255, 0.4); }
      80%  { border-color: #9933ff; box-shadow: 0 0 20px #9933ff, 0 0 35px rgba(153, 51, 255, 0.4); }
      100% { border-color: #ff0055; box-shadow: 0 0 20px #ff0055, 0 0 35px rgba(255, 0, 85, 0.4); }
    }

    .rarity-purple:hover {
      border-color: #a855f7;
      box-shadow: 0 0 20px #a855f7, 0 0 35px rgba(168, 85, 247, 0.5);
    }

    .rarity-gold:hover {
      border-color: #eab308;
      box-shadow: 0 0 20px #eab308, 0 0 35px rgba(234, 179, 8, 0.5);
    }

    .rarity-orange:hover {
      border-color: #f97316;
      box-shadow: 0 0 20px #f97316, 0 0 35px rgba(249, 115, 22, 0.5);
    }

    .rarity-green:hover {
      border-color: #22c55e;
      box-shadow: 0 0 20px #22c55e, 0 0 35px rgba(34, 197, 94, 0.5);
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="back-btn">← Back to Menu</a>
    <h1 class="main-title">DynastyDex Rarity List Official</h1>
  </header>

  <main class="inventory-container" id="inventory"></main>

  <script>
    async function loadCards() {
      try {
        const response = await fetch('cards.json');
        const cards = await response.json();
        const container = document.getElementById('inventory');

        container.innerHTML = cards.map(card => `
          <div class="card ${card.rarityClass}">
            <span class="card-badge">${card.id}</span>
            <img class="card-img" src="${card.img}" alt="${card.title}">
            <h3 class="card-title">${card.title}</h3>
            <p class="card-info">Rareza: <span class="rarity-val">${card.rarity}</span></p>
            <p class="card-info">Artista: <span class="artist-val">${card.artist}</span></p>
          </div>
        `).join('');
      } catch (err) {
        console.error('Error cargando las cartas:', err);
      }
    }

    loadCards();
  </script>
</body>
</html>
